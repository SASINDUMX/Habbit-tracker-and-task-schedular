<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="24 16" filter="url(#glow)" />
  
  <!-- Inner Target Ring -->
  <circle cx="256" cy="256" r="96" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="8" />

  <!-- Compass / Clock Hands & Core Indicator -->
  <circle cx="256" cy="256" r="32" fill="#22c55e" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  
  <!-- Needle & Check Accent -->
  <path d="M256 128 L272 240 L256 256 L240 240 Z" fill="#4ade80" />
  <path d="M256 384 L240 272 L256 256 L272 272 Z" fill="#15803d" />
  <path d="M384 256 L272 272 L256 256 L272 240 Z" fill="#16a34a" />
  <path d="M128 256 L240 240 L256 256 L240 272 Z" fill="#86efac" />
</svg>
